<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
/* Layout: left nav + content on desktop; bottom tab bar + single column on phones. Ledger-green accent on cool slate. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface2:#f5f7f9; --ink:#16222e; --muted:#5b6a79; --line:#dbe2e8;

  --warn:#9a5b00; --warn-soft:#fdf0d9; --bad:#b42318; --bad-soft:#fde7e4; --good:#17803d; --good-soft:#e0f5e8;
  --shadow:0 1px 2px rgba(20,34,46,.06),0 6px 20px rgba(20,34,46,.06);
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-head:'Space Grotesk','Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f171e; --surface:#16212b; --surface2:#1b2833; --ink:#e8eef3; --muted:#93a4b3; --line:#28384a;
  --accent:#3ec3ab; --accent-ink:#06241f; --accent-soft:#123a34;
  --warn:#f2b25c; --warn-soft:#3a2c12; --bad:#ff8a7d; --bad-soft:#3d1b18; --good:#5fd68a; --good-soft:#123322;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171e; --surface:#16212b; --surface2:#1b2833; --ink:#e8eef3; --muted:#93a4b3; --line:#28384a;
  --accent:#3ec3ab; --accent-ink:#06241f; --accent-soft:#123a34;
  --warn:#f2b25c; --warn-soft:#3a2c12; --bad:#ff8a7d; --bad-soft:#3d1b18; --good:#5fd68a; --good-soft:#123322;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font-body);

h1,h2,h3{font-family:var(--font-head);margin:0;line-height:1.2;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
.muted{color:var(--muted)} .r{text-align:right} .nowrap{white-space:nowrap}

.shell{max-width:1260px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding-block:14px}
.side{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);

.nav:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.icon-btn:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.stack{display:flex;flex-direction:column;gap:16px;min-width:0}

@media (min-width:1020px){.grid2{grid-template-columns:minmax(0,1fr) 340px}.grid2.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1 1 150px;min-width:0}
.row>.auto{flex:0 0 auto}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface2)}
a.btn{text-decoration:none;color:var(--ink)}

.chips{display:flex;gap:6px;flex-wrap:wrap}

.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.stat .k{font-size:12px;font-weight:600;color:var(--muted)}
.stat .v{font:700 22px var(--font-head);margin-top:4px;overflow-wrap:anywhere}

.stat.good .v{color:var(--good)} .stat.bad .v{color:var(--bad)}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;font-weight:600;color:var(--muted);background:var(--surface2);white-space:nowrap}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--surface2)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}

.lines{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.line{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2)}
.line .l-name{grid-column:1/-1;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.line .l-name>div{min-width:0}
.line .l-name b{overflow-wrap:anywhere}
.line label{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:600;color:var(--muted);min-width:0}
.line input,.line select{min-height:36px;padding:5px 8px}
.line .l-amt{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:600;color:var(--muted);justify-content:flex-end}
.line .l-amt b{font-size:15px;color:var(--ink);line-height:36px}
.line small{display:block;font-size:12px}
.warn-t{color:var(--warn)}
@media (min-width:640px){
  .line{grid-template-columns:minmax(0,1.9fr) repeat(var(--n,4),minmax(0,1fr)) 108px;align-items:end}
  .line .l-name{grid-column:auto;align-self:center}
  .line .l-name .icon-btn{order:2}
}
.adder{display:flex;gap:8px;margin-top:14px}
.adder input{flex:1}
.sumrow{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
.sumrow.total{border-top:2px solid var(--ink);margin-top:6px;padding-top:10px;font:700 20px var(--font-head)}
.sumrow.due b{color:var(--bad)} .sumrow.ok b{color:var(--good)}
.msg{font-size:13px;margin-top:10px;color:var(--bad)} .msg.ok{color:var(--good)}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-weight:500}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:600 16px var(--font-head);margin-bottom:4px}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);align-items:center;min-width:0}
.li:last-child{border-bottom:0}
.li.click{cursor:pointer} .li.click:hover{background:var(--surface2)}
.li>div{min-width:0} .li .t{font-weight:600;overflow-wrap:anywhere} .li .s{font-size:12px;color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end}
.bar{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.bcol{height:110px;width:100%;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 33.3%}
.bcol i{display:block;width:70%;max-width:38px;min-height:2px;background:var(--accent);border-radius:4px 4px 0 0}
.bar b{font-size:12px} .bar span{font-size:11px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 16px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.toolbar .grow{flex:1 1 220px;min-width:0}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}

.backdrop{position:fixed;inset:0;z-index:50;background:rgba(10,18,26,.55);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:520px;margin:auto;padding:20px;min-width:0}
.modal.wide{max-width:780px}
.modal h2{font-size:18px;margin-bottom:14px}
.modal .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.modal .actions .push{margin-left:auto}
.paper{overflow-x:auto;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface2)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (min-width:860px){#toast{bottom:28px}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
#printArea{display:none}
@media print{body{padding:0;background:#fff}.shell,.backdrop,#toast,.side{display:none!important}#printArea{display:block}}
</style>
</head>
<body>

<div class="shell" id="app">
  <nav class="side" id="nav" aria-label="Main"></nav>
  <main class="stack" id="main">
    <header class="top"><h1 id="pageTitle">Dashboard</h1><span class="shopname" id="shopName"></span></header>
    <div id="view" class="stack"></div>
  </main>
</div>
<div id="modalRoot"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="printArea"></div>
<style id="printCss"></style>

<script>
(function(){
'use strict';

// <pure>
const pad=n=>String(n).padStart(2,'0');
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function todayStr(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function addDays(s,n){const p=s.split('-').map(Number);return todayStr(new Date(p[0],p[1]-1,p[2]+n));}
function fmtDate(s){if(!s)return '';const p=s.split('-');return (+p[2])+' '+MON[+p[1]-1]+' '+p[0];}
function r2(n){return Math.round((Number(n)+Number.EPSILON)*100)/100;}
function num(v){const n=parseFloat(v);return isFinite(n)?n:0;}
const inr2=new Intl.NumberFormat('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const inr0=new Intl.NumberFormat('en-IN',{maximumFractionDigits:0});
function money(n){return '₹'+inr2.format(r2(n));}
function money0(n){return '₹'+inr0.format(Math.round(n));}
function qtyFmt(n){return String(Math.round(num(n)*1000)/1000);}
function shortMoney(n){n=Math.round(n);if(n>=1e5)return (n/1e5).toFixed(1)+'L';if(n>=1e3)return (n/1e3).toFixed(1)+'k';return String(n);}
function calcBill(items,billDisc,gstOn){
  let gross=0,itemDisc=0,costTotal=0;
  const lines=items.map(it=>{
    const q=num(it.qty),rt=num(it.rate),dp=Math.min(100,Math.max(0,num(it.disc)));
    const line=q*rt,d=line*dp/100,net=line-d;
    gross+=line;itemDisc+=d;costTotal+=q*num(it.cost);
    return {line:line,net:net,gstp:gstOn?num(it.gst):0};
  });
  const sumNet=lines.reduce((a,l)=>a+l.net,0);
  const bd=Math.min(Math.max(0,num(billDisc)),sumNet);
  const f=sumNet>0?(sumNet-bd)/sumNet:0;
  let taxable=0,gst=0;
  lines.forEach(l=>{const t=l.net*f;l.taxable=t;l.gst=t*l.gstp/100;taxable+=t;gst+=l.gst;});
  const exact=taxable+gst,total=Math.round(exact);
  return {gross:r2(gross),itemDisc:r2(itemDisc),billDisc:r2(bd),taxable:r2(taxable),gst:r2(gst),roundOff:r2(total-exact),total:total,costTotal:r2(costTotal),lines:lines};
}
const ONES=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
const TENS=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
function two(n){return n<20?ONES[n]:TENS[Math.floor(n/10)]+(n%10?' '+ONES[n%10]:'');}
function three(n){return (n>=100?ONES[Math.floor(n/100)]+' Hundred'+(n%100?' ':''):'')+(n%100?two(n%100):'');}
function words(n){
  n=Math.round(n);if(n<=0)return 'Zero';
  const out=[];const cr=Math.floor(n/1e7);n%=1e7;const la=Math.floor(n/1e5);n%=1e5;const th=Math.floor(n/1e3);n%=1e3;
  if(cr)out.push(three(cr)+' Crore');if(la)out.push(two(la)+' Lakh');if(th)out.push(two(th)+' Thousand');if(n)out.push(three(n));
  return out.join(' ');
}
function stockMap(S){
  const m={};
  S.products.forEach(p=>{m[p.id]=num(p.opening);});
  S.purchases.forEach(b=>b.items.forEach(i=>{if(i.pid&&(i.pid in m))m[i.pid]+=num(i.qty);}));
  S.sales.forEach(b=>b.items.forEach(i=>{if(i.pid&&(i.pid in m))m[i.pid]-=num(i.qty);}));
  (S.returns||[]).forEach(r=>r.items.forEach(i=>{if(i.pid&&(i.pid in m))m[i.pid]+=(r.kind==='sales'?num(i.qty):-num(i.qty));}));
  Object.keys(m).forEach(k=>{m[k]=Math.round(m[k]*1000)/1000;});
  return m;
}
function paidOf(b){return r2((b.payments||[]).reduce((a,p)=>a+num(p.amount),0));}
function dueOf(b){return Math.max(0,r2(b.total-paidOf(b)));}
function rangeBounds(p,from,to,today){
  const t=today.split('-').map(Number),y=t[0],m=t[1];
  switch(p){
    case 'today':return [today,today];
    case 'yesterday':{const d=addDays(today,-1);return [d,d];}
    case 'week':return [addDays(today,-6),today];
    case 'month':return [y+'-'+pad(m)+'-01',todayStr(new Date(y,m,0))];
    case 'lastmonth':return [todayStr(new Date(y,m-2,1)),todayStr(new Date(y,m-1,0))];
    case 'fy':{const sy=m>=4?y:y-1;return [sy+'-04-01',(sy+1)+'-03-31'];}
    case 'custom':return [from||'0000-01-01',to||'9999-12-31'];
    default:return ['0000-01-01','9999-12-31'];
  }
}
function csvCell(v){v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function toCsv(rows){return '﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');}
// </pure>

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const inClaude=!!(window.claude&&typeof window.claude.use==='function');
const UNITS=['pcs','pkt','box','bottle','can','carton','case','kg','g','ltr','ml','dozen','set'];
const CATEGORIES=['Namkeen','Kurkure & Chips','Biscuits','Snacks','Cold Drinks','Water','Juice','Other'];
const MODES=['Cash','UPI','Card','Udhaar'];

/* ---------- storage ---------- */
const KEY='dukaan_hisaab_v1';
let storageOk=true;
function blank(){return {v:2,demo:false,parties:[],vouchers:[],returns:[],settings:{shop:'My Shop',address:'',phone:'',gstin:'',gstOn:false,prefix:'INV',nextBill:1,nextPur:1,footer:'Thank you! Visit again.',paper:'a4',lastBackup:''},products:[],sales:[],purchases:[]};}
function normalize(o){
  const b=blank();
  const s=Object.assign(b.settings,(o&&o.settings)||{});
  return {v:2,demo:!!(o&&o.demo),parties:Array.isArray(o&&o.parties)?o.parties:[],vouchers:Array.isArray(o&&o.vouchers)?o.vouchers:[],returns:Array.isArray(o&&o.returns)?o.returns:[],settings:s,products:(o&&o.products)||[],sales:(o&&o.sales)||[],purchases:(o&&o.purchases)||[]};
}
function load(){try{const t=localStorage.getItem(KEY);if(t)return normalize(JSON.parse(t));}catch(e){storageOk=false;}return blank();}
let dbHandle=null;
function openLedgerDB(){
  return new Promise((resolve)=>{
    if(!('indexedDB' in window)){resolve(null);return;}
    try{
      const req=indexedDB.open('OSRetailLedgerDB',1);
      req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('snapshots'))db.createObjectStore('snapshots',{keyPath:'id'});};
      req.onsuccess=()=>{dbHandle=req.result;resolve(dbHandle);};
      req.onerror=()=>resolve(null);
    }catch(e){resolve(null);}
  });
}
function save(){
  const snapshot=JSON.stringify(S);
  try{localStorage.setItem(KEY,snapshot);storageOk=true;}catch(e){storageOk=false;toast('Storage is full or blocked. Download a backup now.');}
  if(dbHandle){try{const tx=dbHandle.transaction('snapshots','readwrite');tx.objectStore('snapshots').put({id:'main',savedAt:Date.now(),data:snapshot});}catch(e){}}
}

async function hydrateIndexedDB(){
  const db=await openLedgerDB();if(!db)return;
  try{

/* ---------- file save / print ---------- */
async function saveFile(name,data,mime){
  if(inClaude){
    try{const d=await window.claude.use('downloads');if(d){await d.save({filename:name,data:data});return true;}}catch(e){if(e&&e.code==='declined')return false;}
  }
  try{
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:mime||'text/plain'}));a.download=name;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);return true;
  }catch(e){toast('Could not save the file here');return false;}
}

function refreshSale(){
  const d=dSale,g=S.settings.gstOn,c=calcBill(d.items.map(i=>Object.assign({},i,{gst:g?i.gst:0})),d.billDisc,g);
  c.lines.forEach((l,i)=>{
    const a=$('#amt-sale-'+i);if(a)a.textContent=money(l.net);
    const it=d.items[i];if(!it.pid)return;
    const avail=STK[it.pid]||0,p=prod(it.pid);
    const s=$('#stk-sale-'+i),w=$('#warn-sale-'+i);
    if(s)s.textContent='In stock: '+qtyFmt(avail)+' '+(p?p.unit:'');
    if(w)w.textContent=num(it.qty)>avail?'Only '+qtyFmt(avail)+' in stock. Stock will go negative.':'';
  });
  const set=(id,v)=>{const e=$(id);if(e)e.textContent=v;};
  set('#sSub',money(c.gross));set('#sIDisc',c.itemDisc>0?'-'+money(c.itemDisc):money(0));set('#sGst',money(c.gst));
  set('#sRound',(c.roundOff>0?'+':c.roundOff<0?'-':'')+money(Math.abs(c.roundOff)));set('#sTotal',money(c.total));
  const pe=$('#salePaid');
  const paid=(d.paid===null||d.paid==='')?c.total:Math.min(c.total,num(d.paid));
  if(pe&&document.activeElement!==pe&&d.paid===null)pe.placeholder=String(c.total);
  const due=r2(c.total-paid),row=$('#sDueRow');
  if(row){row.className='sumrow '+(due>0.004?'due':'ok');set('#sDueLbl',due>0.004?'Balance due':'Fully paid');set('#sDue',money(Math.max(0,due)));}
}
function buildSale(d){
  const g=S.settings.gstOn;
  const items=d.items.map(it=>({pid:it.pid||null,name:it.name,unit:it.unit||'',qty:num(it.qty),rate:num(it.rate),disc:num(it.disc),gst:g?num(it.gst):0,cost:num(it.cost)}));
  const c=calcBill(items,d.billDisc,g),n=S.settings.nextBill++;
  const paid=(d.paid===null||d.paid==='')?c.total:Math.min(c.total,Math.max(0,num(d.paid)));
  return {id:uid(),no:S.settings.prefix+'-'+pad4(n),n:n,date:d.date,ts:Date.now()+n,customer:(d.customer||'').trim(),phone:(d.phone||'').trim(),address:d.address||'',items:items,gstOn:g,billDisc:c.billDisc,gross:c.gross,itemDisc:c.itemDisc,taxable:c.taxable,gst:c.gst,roundOff:c.roundOff,total:c.total,costTotal:c.costTotal,mode:d.mode,payments:paid>0?[{date:d.date,amount:r2(paid),mode:d.mode==='Udhaar'?'Cash':d.mode}]:[]};
}
function saveSale(print){
  const d=dSale,m=$('#saleMsg');
  if(!d.items.length){m.textContent='Add at least one item.';return;}
  const bad=d.items.findIndex(i=>!(num(i.qty)>0));if(bad>=0){m.textContent='Enter a quantity for '+d.items[bad].name+'.';return;}
  const noRate=d.items.findIndex(i=>i.rate===''||num(i.rate)<0);if(noRate>=0){m.textContent='Enter the selling rate for '+d.items[noRate].name+'.';return;}
  if(!d.date){m.textContent='Pick the bill date.';return;}
  const b=buildSale(d);
  rememberParty({name:d.customer,phone:d.phone,address:d.address,type:'Customer'});
  S.sales.push(b);save();dSale=newSale();STK=stockMap(S);
  render();toast('Bill '+b.no+' saved');
  openSale(b.id,{autoPrint:!!print});
}

function vReports(){
  const r=rangeBounds(ui.rPeriod,ui.rFrom,ui.rTo,todayStr());
  const sales=S.sales.filter(b=>inRange(b,r)),purs=S.purchases.filter(b=>inRange(b,r));
  const sTot=sales.reduce((a,b)=>a+b.total,0),pTot=purs.reduce((a,b)=>a+b.total,0);
  const disc=sales.reduce((a,b)=>a+b.itemDisc+b.billDisc,0),gst=sales.reduce((a,b)=>a+b.gst,0);
  const taxable=sales.reduce((a,b)=>a+b.taxable,0),profit=sales.reduce((a,b)=>a+b.taxable-b.costTotal,0);
  const got=sales.reduce((a,b)=>a+paidOf(b),0);
  const byMode={};sales.forEach(b=>{(b.payments||[]).forEach(p=>{byMode[p.mode]=(byMode[p.mode]||0)+num(p.amount);});const d=dueOf(b);if(d>0)byMode['Pending']=(byMode['Pending']||0)+d;});
  const items={};sales.forEach(b=>{const c=calcBill(b.items,b.billDisc,b.gstOn);b.items.forEach((it,i)=>{const k=it.name;items[k]=items[k]||{n:k,u:it.unit,q:0,a:0,p:0};items[k].q+=num(it.qty);items[k].a+=c.lines[i].taxable;items[k].p+=c.lines[i].taxable-num(it.qty)*num(it.cost);});});
  const top=Object.values(items).sort((a,b)=>b.a-a.a).slice(0,15);
  // Item-wise inward/outward movement for the selected reporting period.
  const movement={};
  const movementKey=it=>it.pid||('name:'+String(it.name||'').toLowerCase());
  purs.forEach(b=>b.items.forEach(it=>{
    const k=movementKey(it);
    movement[k]=movement[k]||{name:it.name,unit:it.unit||'',purchaseQty:0,saleQty:0,purchaseValue:0,saleValue:0};
    movement[k].purchaseQty+=num(it.qty);
    movement[k].purchaseValue+=num(it.qty)*num(it.rate);
  }));
  sales.forEach(b=>b.items.forEach(it=>{
    const k=movementKey(it);
    movement[k]=movement[k]||{name:it.name,unit:it.unit||'',purchaseQty:0,saleQty:0,purchaseValue:0,saleValue:0};
    movement[k].saleQty+=num(it.qty);
    movement[k].saleValue+=num(it.qty)*num(it.rate);
  }));
  const movementRows=Object.values(movement).sort((a,b)=>(b.purchaseQty+b.saleQty)-(a.purchaseQty+a.saleQty));
  const dayMap={};sales.forEach(b=>{dayMap[b.date]=dayMap[b.date]||{s:0,p:0,n:0};dayMap[b.date].s+=b.total;dayMap[b.date].n++;});purs.forEach(b=>{dayMap[b.date]=dayMap[b.date]||{s:0,p:0,n:0};dayMap[b.date].p+=b.total;});
  const days=Object.keys(dayMap).sort().reverse().slice(0,62);
  let h='<div class="card flat"><div class="row"><div>'+periodChips(ui.rPeriod,'rPeriod',PERIODS)+'</div></div>'
    +(ui.rPeriod==='custom'?'<div class="row" style="margin-top:10px"><label class="f">From<input type="date" id="rFrom" value="'+esc(ui.rFrom)+'"></label><label class="f">To<input type="date" id="rTo" value="'+esc(ui.rTo)+'"></label></div>':'')
    +'<p class="muted" style="margin:10px 0 0">'+(ui.rPeriod==='all'?'All records':fmtDate(r[0])+' to '+fmtDate(r[1]))+'</p></div>';
  h+='<div class="stats"><div class="stat"><div class="k">Total sales</div><div class="v num">'+money(sTot)+'</div><div class="s">'+sales.length+' bills</div></div>'
    +'<div class="stat"><div class="k">Total purchases</div><div class="v num">'+money(pTot)+'</div><div class="s">'+purs.length+' entries</div></div>'
    +'<div class="stat '+(profit>=0?'good':'bad')+'"><div class="k">Gross profit</div><div class="v num">'+money(profit)+'</div><div class="s">'+(taxable>0?(profit/taxable*100).toFixed(1)+'% of sales before GST':'No sales in this period')+'</div></div>'
    +'<div class="stat"><div class="k">Discounts given</div><div class="v num">'+money(disc)+'</div></div>'
    +(S.settings.gstOn?'<div class="stat"><div class="k">GST collected</div><div class="v num">'+money(gst)+'</div></div>':'')
    +'<div class="stat"><div class="k">Money received</div><div class="v num">'+money(got)+'</div><div class="s">Pending '+money(sTot-got)+'</div></div></div>';
  h+='<div class="toolbar"><span class="muted">Download as Excel-ready CSV</span><div class="chips"><button class="btn sm" data-act="csv" data-v="sales">Sales</button><button class="btn sm" data-act="csv" data-v="purchases">Purchases</button><button class="btn sm" data-act="csv" data-v="stock">Stock</button><button class="btn sm" data-act="csv" data-v="movement">Item movement</button></div></div>';
  h+='<section class="card"><h2>Item-wise wholesale movement</h2><p class="muted">Selected period: quantity purchased, quantity sold, current stock and transaction values.</p>'
    +(movementRows.length?'<div class="tablewrap"><table><thead><tr><th>Item</th><th class="r">Purchased qty</th><th class="r">Sold qty</th><th class="r">Current stock</th><th class="r">Purchase value</th><th class="r">Sales value</th></tr></thead><tbody>'
    +movementRows.map(t=>{const p=S.products.find(x=>x.name===t.name);const current=p?(STK[p.id]||0):'—';return '<tr><td><b>'+esc(t.name)+'</b></td><td class="r num">'+qtyFmt(t.purchaseQty)+' '+esc(t.unit)+'</td><td class="r num">'+qtyFmt(t.saleQty)+' '+esc(t.unit)+'</td><td class="r num">'+(current==='—'?current:qtyFmt(current)+' '+esc(t.unit))+'</td><td class="r num">'+money(t.purchaseValue)+'</td><td class="r num">'+money(t.saleValue)+'</td></tr>';}).join('')
    +'</tbody></table></div>':'<div class="empty">No purchase or sales item movement in this period.</div>')+'</section>';
  h+='<div class="grid2 even"><section class="card"><h2>Collection by mode</h2>'+(Object.keys(byMode).length?'<div class="list">'+Object.keys(byMode).map(k=>'<div class="li"><span>'+esc(k)+'</span><b class="num">'+money(byMode[k])+'</b></div>').join('')+'</div>':'<div class="empty">No sales in this period.</div>')+'</section>'
    +'<section class="card"><h2>Best selling items</h2>'+(top.length?'<div class="tablewrap"><table style="min-width:0"><thead><tr><th>Item</th><th class="r">Qty</th><th class="r">Sales</th><th class="r">Profit</th></tr></thead><tbody>'+top.map(t=>'<tr><td>'+esc(t.n)+'</td><td class="r num">'+qtyFmt(t.q)+' '+esc(t.u)+'</td><td class="r num">'+money(t.a)+'</td><td class="r num">'+money(t.p)+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No sales in this period.</div>')+'</section></div>';
  h+='<section class="card"><h2>Day by day</h2>'+(days.length?'<div class="tablewrap"><table><thead><tr><th>Date</th><th class="r">Bills</th><th class="r">Sales</th><th class="r">Purchases</th></tr></thead><tbody>'+days.map(d=>'<tr><td>'+fmtDate(d)+'</td><td class="r num">'+dayMap[d].n+'</td><td class="r num">'+money(dayMap[d].s)+'</td><td class="r num">'+money(dayMap[d].p)+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">Nothing recorded in this period.</div>')
    +'<p class="muted" style="margin:10px 0 0;font-size:12px">Profit is sales (before GST, after discounts) minus the purchase price of items sold. Custom items without a purchase price count as zero cost.</p></section>';
  return h;
}
function exportCsv(kind){
  const r=rangeBounds(ui.rPeriod,ui.rFrom,ui.rTo,todayStr());let rows,name;
  if(kind==='sales'){
    rows=[['Bill no','Date','Customer','Phone','Items','Subtotal','Discount','GST','Total','Received','Due','Mode']].concat(S.sales.filter(b=>inRange(b,r)).sort((a,b)=>a.date.localeCompare(b.date)).map(b=>[b.no,b.date,b.customer,b.phone,b.items.map(i=>qtyFmt(i.qty)+' '+i.unit+' '+i.name).join('; '),b.gross,r2(b.itemDisc+b.billDisc),b.gst,b.total,paidOf(b),dueOf(b),b.mode]));name='sales';
  }else if(kind==='purchases'){
    rows=[['Entry no','Date','Supplier','Supplier bill','Items','Total','Paid','Due']].concat(S.purchases.filter(b=>inRange(b,r)).sort((a,b)=>a.date.localeCompare(b.date)).map(b=>[b.no,b.date,b.supplier,b.invNo,b.items.map(i=>qtyFmt(i.qty)+' '+i.unit+' '+i.name).join('; '),b.total,paidOf(b),dueOf(b)]));name='purchases';
  }else if(kind==='movement'){
    const m={};
    const key=it=>it.pid||('name:'+String(it.name||'').toLowerCase());
    S.purchases.filter(b=>inRange(b,r)).forEach(b=>b.items.forEach(it=>{const k=key(it);m[k]=m[k]||{name:it.name,unit:it.unit||'',purchaseQty:0,saleQty:0,purchaseValue:0,saleValue:0};m[k].purchaseQty+=num(it.qty);m[k].purchaseValue+=num(it.qty)*num(it.rate);}));
    S.sales.filter(b=>inRange(b,r)).forEach(b=>b.items.forEach(it=>{const k=key(it);m[k]=m[k]||{name:it.name,unit:it.unit||'',purchaseQty:0,saleQty:0,purchaseValue:0,saleValue:0};m[k].saleQty+=num(it.qty);m[k].saleValue+=num(it.qty)*num(it.rate);}));
    rows=[['Item','Unit','Purchased Qty','Sold Qty','Current Stock','Purchase Value','Sales Value']].concat(Object.values(m).map(x=>{const p=S.products.find(z=>z.name===x.name);return [x.name,x.unit,x.purchaseQty,x.saleQty,p?(STK[p.id]||0):'',x.purchaseValue,x.saleValue];}));name='item-movement';
  }else{
    rows=[['Item','Unit','In stock','Purchase price','Selling price','Stock value']].concat(S.products.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>[p.name,p.unit,STK[p.id]||0,p.cost,p.sell,r2(Math.max(0,STK[p.id]||0)*num(p.cost))]));name='stock';
  }
  saveFile('wholesale-'+name+'-'+todayStr()+'.csv',toCsv(rows),'text/csv');
}


function rememberParty(d){
 const name=String(d.name||'').trim();if(!name)return;
 let p=S.parties.find(x=>x.name.toLowerCase()===name.toLowerCase());
 if(!p){p={id:uid(),name:name,type:d.type||'Both',phone:d.phone||'',address:d.address||'',gstin:'',opening:0};S.parties.push(p);}
 else{if(d.phone)p.phone=d.phone;if(d.address)p.address=d.address;if(p.type!=='Both'&&d.type&&p.type!==d.type)p.type='Both';}
}

    +'<div class="row"><button class="btn primary auto" data-act="exportBackup">Download backup</button><label class="btn auto" style="cursor:pointer">Restore from backup<input type="file" id="restoreFile" accept=".json,application/json" hidden></label></div><div id="restoreBox"></div></section>'
    +'<section class="card"><h2>Danger zone</h2><div class="row"><label class="f">Type DELETE to erase all items, bills and purchases<input id="resetWord" type="text" autocomplete="off"></label><button class="btn danger auto" id="resetBtn" data-act="resetAll" disabled>Erase everything</button></div>'
    +(!S.products.length&&!S.sales.length?'<p class="muted" style="margin-bottom:0">Want to look around first? <button class="btn sm" data-act="loadDemo">Load example data</button></p>':'')+'</section>';
}
function exportBackup(){
  S.settings.lastBackup=todayStr();save();
  saveFile('dukaan-hisaab-backup-'+todayStr()+'.json',JSON.stringify(S,null,1),'application/json').then(ok=>{if(ok){toast('Backup downloaded');if(ui.view==='home'||ui.view==='setup')render();}});
}
function loadDemo(){
  S=blank();S.demo=true;S.settings.shop='Sharma General Store';S.settings.address='Main Market, Sector 4';S.settings.phone='98xxxxxx10';
  const P=[['Basmati Rice','kg',92,115,0,20],['Sugar','kg',41,48,0,25],['Toor Dal','kg',128,150,0,15],['Sunflower Oil 1L','pcs',138,160,0,12],['Tata Salt 1kg','pkt',22,28,0,20],['Maggi Noodles','pkt',12,14,0,30]];
  P.forEach(p=>S.products.push({id:uid(),name:p[0],unit:p[1],cost:p[2],sell:p[3],gst:p[4],opening:0,low:p[5]}));
  const t=todayStr(),pid=n=>S.products.find(p=>p.name===n);
  const addPur=(date,sup,list,paidAll)=>{const items=list.map(l=>({pid:pid(l[0]).id,name:l[0],unit:pid(l[0]).unit,qty:l[1],rate:pid(l[0]).cost}));const total=r2(items.reduce((a,i)=>a+i.qty*i.rate,0));const n=S.settings.nextPur++;S.purchases.push({id:uid(),no:'PUR-'+pad4(n),n:n,date:date,ts:Date.now()+n,supplier:sup,phone:'',invNo:'',items:items,total:total,mode:'Cash',payments:paidAll?[{date:date,amount:total,mode:'Cash'}]:[{date:date,amount:Math.round(total/2),mode:'UPI'}]});};
  addPur(addDays(t,-6),'Gupta Traders',[['Basmati Rice',60],['Sugar',80],['Toor Dal',40],['Sunflower Oil 1L',24]],true);
  addPur(addDays(t,-3),'Ravi Wholesale',[['Tata Salt 1kg',40],['Maggi Noodles',120],['Sugar',30]],false);
  const sell=(back,cust,phone,list,mode,paidFrac)=>{
    const d={date:addDays(t,-back),customer:cust,phone:phone,billDisc:'',mode:mode,paid:null,items:list.map(l=>{const p=pid(l[0]);return {pid:p.id,name:p.name,unit:p.unit,qty:l[1],rate:p.sell,disc:0,gst:p.gst,cost:p.cost};})};
    const c=calcBill(d.items,0,false);if(paidFrac!==undefined)d.paid=String(Math.round(c.total*paidFrac));S.sales.push(buildSale(d));
  };
  sell(5,'Mrs. Verma','',[['Basmati Rice',5],['Toor Dal',2],['Sugar',3]],'Cash');
  sell(4,'','',[['Maggi Noodles',10],['Tata Salt 1kg',2]],'UPI');
  sell(2,'Anil Kumar','9811100022',[['Sunflower Oil 1L',3],['Basmati Rice',8],['Sugar',5]],'Udhaar',0);
  sell(1,'','',[['Toor Dal',4],['Sugar',2],['Tata Salt 1kg',3]],'Cash');
  sell(0,'Neha Singh','9822233344',[['Basmati Rice',3],['Maggi Noodles',6],['Sunflower Oil 1L',1]],'UPI',0.6);
  save();STK=stockMap(S);toast('Example data loaded');render();
}

/* ---------- render ---------- */
const VIEWS={home:vHome,bill:vBill,purchase:vPurchase,parties:vParties,vouchers:vVouchers,returns:vReturns,stock:vStock,bills:vBills,reports:vReports,setup:vSetup};
function renderNav(){
  $('#nav').innerHTML='<div class="brand">OS Wholesale Ledger<small>Wholesale • Purchase • Sales • Stock</small></div>'+NAV.map(n=>'<button class="nav" data-act="nav" data-v="'+n[0]+'"'+(ui.view===n[0]?' aria-current="page"':'')+'>'+icon(n[2])+'<span>'+n[1]+'</span></button>').join('');
}
function render(){
  if(!VIEWS[ui.view])ui.view='home';
  STK=stockMap(S);
  $('#printCss').textContent=billCss(S.settings.paper)+pageRule(S.settings.paper);
  renderNav();
  $('#pageTitle').textContent=TITLES[ui.view];document.title=(S.settings.shop||'OS Wholesale Ledger')+' | '+TITLES[ui.view];
  $('#shopName').textContent=S.settings.shop||'';
  $('#view').innerHTML=VIEWS[ui.view]();
  if(ui.view==='bill')refreshSale();
  if(ui.view==='purchase')refreshPur();
  if(ui.view==='stock')renderStockList();
  if(ui.view==='bills')renderBillList();
  if(ui.focusAdd){ui.focusAdd=false;const a=$('#addSearch');if(a)a.focus();}
}
function go(v){
  ui.view=v;closeModal();
  try{if(location.hash.slice(1)!==v)history.replaceState(null,'','#'+v);}catch(e){}
  render();window.scrollTo(0,0);
}

/* ---------- item adding ---------- */
function addSale(){
  const inp=$('#addSearch'),name=inp.value.trim();if(!name)return;
  const p=findProd(name);
  const ex=p&&dSale.items.find(i=>i.pid===p.id);
  if(ex){ex.qty=String(num(ex.qty)+1);}
  else if(p){dSale.items.push({pid:p.id,name:p.name,unit:p.unit,qty:'1',rate:String(p.sell||''),disc:'',gst:String(p.gst||0),cost:p.cost});}
  else{dSale.items.push({pid:null,name:name,unit:'',qty:'1',rate:'',disc:'',gst:'0',cost:0});}
  ui.focusAdd=true;render();
}
function addPur(){
  const inp=$('#addSearch'),name=inp.value.trim();if(!name)return;
  const p=findProd(name);
  const ex=dPur.items.find(i=>(p&&i.pid===p.id)||(!p&&!i.pid&&i.name.toLowerCase()===name.toLowerCase()));
  if(ex){ex.qty=String(num(ex.qty)+1);}
  else if(p){dPur.items.push({pid:p.id,name:p.name,unit:p.unit,qty:'1',rate:String(p.cost||''),sell:'',});}
  else{dPur.items.push({pid:null,name:name,unit:'pcs',qty:'1',rate:'',sell:''});}
  ui.focusAdd=true;render();
}

/* ---------- events ---------- */
function setDraft(path,v){
  const p=path.split('.'),d=p[0]==='sale'?dSale:dPur,k=p[1];
  if(k==='paid')d.paid=v===''?null:v;else d[k]=v;
  if(k==='mode'&&p[0]==='sale'||k==='mode'&&p[0]==='pur'){
    if(v==='Udhaar'){d.paid='0';}else if(d.paid==='0'){d.paid=null;}
    const pe=$('#'+p[0]+'Paid');if(pe)pe.value=d.paid===null?'':d.paid;
  }
}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.d==='sale.customer'){const p=S.parties.find(x=>x.name.toLowerCase()===t.value.trim().toLowerCase());if(p){dSale.phone=p.phone||'';dSale.address=p.address||'';const ph=$('[data-d="sale.phone"]'),ad=$('[data-d="sale.address"]');if(ph)ph.value=dSale.phone;if(ad)ad.value=dSale.address;}}
  if(t.dataset.d==='pur.supplier'){const p=S.parties.find(x=>x.name.toLowerCase()===t.value.trim().toLowerCase());if(p){dPur.phone=p.phone||'';dPur.address=p.address||'';const ph=$('[data-d="pur.phone"]'),ad=$('[data-d="pur.address"]');if(ph)ph.value=dPur.phone;if(ad)ad.value=dPur.address;}}
  if(t.dataset.d){setDraft(t.dataset.d,t.value);if(t.dataset.d.startsWith('sale'))refreshSale();else refreshPur();}
  else if(t.dataset.f){const dr=t.dataset.k==='sale'?dSale:dPur;dr.items[+t.dataset.idx][t.dataset.f]=t.value;if(t.dataset.k==='sale')refreshSale();else refreshPur();}
  else if(t.dataset.s){const k=t.dataset.s;S.settings[k]=t.type==='checkbox'?t.checked:(k==='nextBill'?Math.max(1,Math.floor(num(t.value))||1):t.value);save();$('#shopName').textContent=S.settings.shop||'';}
  else if(t.id==='stockSearch'){ui.sQuery=t.value;renderStockList();}
  else if(t.id==='billSearch'){ui.bQuery=t.value;renderBillList();}
  else if(t.id==='resetWord'){$('#resetBtn').disabled=t.value.trim()!=='DELETE';}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.d&&t.dataset.d.endsWith('.mode'))return;
  if(t.id==='retInvoice'){const kind=$('[data-act="saveReturn"]')?.dataset.v||'sales',src=(kind==='sales'?S.sales:S.purchases).find(x=>x.id===t.value),sel=$('#retItem');if(sel)sel.innerHTML='<option value="">Select item</option>'+(src?src.items.map((it,i)=>'<option value="'+i+'">'+esc(it.name)+' — '+qtyFmt(it.qty)+' '+esc(it.unit)+'</option>').join(''):'');}
  if(t.dataset.f==='unit'){const dr=dPur;dr.items[+t.dataset.idx].unit=t.value;}
  if(t.id==='dueOnly'){ui.bDue=t.checked;renderBillList();}
  if(t.id==='rFrom'){ui.rFrom=t.value;render();}
  if(t.id==='rTo'){ui.rTo=t.value;render();}
  if(t.dataset.s==='gstOn'||t.dataset.s==='paper')render();
  if(t.id==='restoreFile'&&t.files&&t.files[0]){
    const rd=new FileReader();
    rd.onload=()=>{
      const box=$('#restoreBox');
      try{
        const o=JSON.parse(rd.result);
        if(!o||!Array.isArray(o.products)||!Array.isArray(o.sales)||!Array.isArray(o.purchases))throw new Error('bad');
        ui.pendingImport=normalize(o);
        box.innerHTML='<div class="banner" style="margin-top:12px"><span>This backup has '+o.products.length+' items, '+o.sales.length+' bills and '+o.purchases.length+' purchases. Restoring replaces what is here now.</span><button class="btn sm" data-act="applyRestore">Replace my data</button></div>';
      }catch(err){box.innerHTML='<div class="msg">This file is not a Dukaan Hisaab backup.</div>';}
    };
    rd.readAsText(t.files[0]);
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='addSearch'){e.preventDefault();if(ui.view==='bill')addSale();else addPur();}
  if(e.key==='Escape'&&$('#modalRoot').firstChild)closeModal();
});
document.addEventListener('click',e=>{
  const bd=e.target.closest('[data-bd]');if(bd&&e.target===bd){closeModal();return;}
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id,v=el.dataset.v;
  if(el.dataset.armed==null&&(a==='delSale'||a==='delPur'||a==='delProduct')){
    el.dataset.armed='1';el.dataset.old=el.textContent;el.textContent='Click again to confirm';
    setTimeout(()=>{if(el.isConnected){delete el.dataset.armed;el.textContent=el.dataset.old;}},4000);return;
  }
  switch(a){
    case 'nav':go(v);break;
    case 'closeModal':closeModal();break;
    case 'homePeriod':ui.period=v;render();break;
    case 'rPeriod':ui.rPeriod=v;render();break;
    case 'bPeriod':ui.bPeriod=v;render();break;
    case 'bTab':ui.bTab=v;render();break;
    case 'stockFilter':ui.sFilter=v;render();break;
    case 'partyForm':partyForm(id);break;case 'partyLedger':partyLedger(id);break;case 'voucherForm':voucherForm(v);break;case 'returnForm':returnForm(v);break;
    case 'saveParty':{const name=$('#partyName').value.trim();if(!name){$('#partyMsg').textContent='Enter party name.';break;}let p=S.parties.find(x=>x.id===id);if(!p){p={id:uid()};S.parties.push(p);}Object.assign(p,{name,type:$('#partyType').value,phone:$('#partyPhone').value.trim(),gstin:$('#partyGstin').value.trim(),address:$('#partyAddress').value.trim(),opening:num($('#partyOpening').value)});save();closeModal();render();toast('Party saved');break;}
    case 'printVoucher':{const vch=(S.vouchers||[]).find(x=>x.id===id);if(vch)printBill(voucherHtml(vch),'Voucher '+vch.no);break;}
    case 'saveVoucher':{const party=$('#vParty').value,amount=num($('#vAmount').value);if(!party||amount<=0){$('#vMsg').textContent='Select a party and enter a valid amount.';break;}const kind=v;S.vouchers.push({id:uid(),no:(kind==='receipt'?'RCPT-':'PAY-')+pad4(S.vouchers.length+1),kind:kind,date:$('#vDate').value||todayStr(),party,amount:r2(amount),mode:$('#vMode').value,note:$('#vNote').value.trim()});save();closeModal();render();toast('Voucher saved');break;}
    case 'saveReturn':{const kind=v,src=(kind==='sales'?S.sales:S.purchases).find(x=>x.id===$('#retInvoice').value),idx=Number($('#retItem').value),orig=src&&src.items[idx],qty=num($('#retQty').value),amount=num($('#retAmount').value);if(!src||!orig||qty<=0||qty>num(orig.qty)||amount<=0){$('#retMsg').textContent='Select invoice item and enter a valid return quantity and value.';break;}S.returns.push({id:uid(),no:'RET-'+pad4(S.returns.length+1),kind,date:$('#retDate').value||todayStr(),party:kind==='sales'?src.customer:src.supplier,invoice:src.no,total:r2(amount),reason:$('#retReason').value,items:[{pid:orig.pid,name:orig.name,unit:orig.unit,qty:qty,rate:r2(amount/qty)}]});save();STK=stockMap(S);closeModal();render();toast('Return saved; stock adjusted');break;}
    case 'addSale':addSale();break;
    case 'addPur':addPur();break;
    case 'rmItem':{(el.dataset.k==='sale'?dSale:dPur).items.splice(+el.dataset.idx,1);render();break;}
    case 'clearSale':dSale=newSale();render();break;
    case 'clearPur':dPur=newPur();render();break;
    case 'saveSale':saveSale(!!el.dataset.print);break;
    case 'savePur':savePur();break;
    case 'openSale':openSale(id);break;
    case 'openPur':openPur(id);break;
    case 'printSale':{const b=S.sales.find(x=>x.id===id);if(b)printBill(billHtml(b,S.settings.paper),'Bill '+b.no);break;}
    case 'payForm':{if(el.dataset.k==='sale')openSale(id,{pay:true});else openPur(id,{pay:true});break;}
    case 'savePay':{
      const list=el.dataset.k==='sale'?S.sales:S.purchases,b=list.find(x=>x.id===id),amt=num($('#payAmt').value);
      if(!(amt>0)){$('#payMsg').textContent='Enter an amount.';break;}
      if(amt>dueOf(b)+0.004){$('#payMsg').textContent='This is more than the balance due.';break;}
      b.payments=(b.payments||[]).concat([{date:$('#payDate').value||todayStr(),amount:r2(amt),mode:$('#payMode').value}]);save();
      toast('Payment saved');if(el.dataset.k==='sale')openSale(id);else openPur(id);render();break;}
    case 'delSale':S.sales=S.sales.filter(x=>x.id!==id);save();closeModal();render();toast('Bill deleted, stock restored');break;
    case 'delPur':S.purchases=S.purchases.filter(x=>x.id!==id);save();closeModal();render();toast('Purchase deleted, stock adjusted');break;
    case 'starterCatalog':addStarterCatalog();break;
    case 'editProduct':productModal(id||'');break;
    case 'saveProduct':saveProduct(id||'');break;
    case 'delProduct':{
      const used=S.sales.some(b=>b.items.some(i=>i.pid===id))||S.purchases.some(b=>b.items.some(i=>i.pid===id));
      if(used){const m=$('#pMsg');if(m)m.textContent='This item is used in bills or purchases, so it cannot be deleted. Set its stock alert to 0 instead.';break;}
      S.products=S.products.filter(p=>p.id!==id);save();closeModal();render();toast('Item deleted');break;}
    case 'csv':exportCsv(v);break;
    case 'exportBackup':exportBackup();break;
    case 'applyRestore':if(ui.pendingImport){S=ui.pendingImport;ui.pendingImport=null;save();render();toast('Backup restored');}break;
    case 'loadDemo':loadDemo();break;
    case 'clearDemo':{const keep=S.settings;S=blank();S.settings=Object.assign(blank().settings,{shop:'My Shop'});save();dSale=newSale();dPur=newPur();render();toast('Example data cleared');break;}
    case 'resetAll':{S=blank();save();dSale=newSale();dPur=newPur();render();toast('All data erased');break;}
  }
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(VIEWS[h]&&h!==ui.view){ui.view=h;closeModal();render();}});
(function init(){const h=(location.hash||'').slice(1);if(VIEWS[h])ui.view=h;render();hydrateIndexedDB();})();
})();
</script>
